services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao
      POSTGRES_DB: leilao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leilao"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
