# Whole stack: `docker compose up --build` (web :3000, api :3333, postgres :5432).
# Only the database, for `npm run dev`: `docker compose up -d db`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao
      POSTGRES_DB: leilao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leilao -d leilao"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://leilao:leilao@db:5432/leilao
      CORS_ORIGIN: http://localhost:3000
      # local-only defaults; set real values in the shell or an .env file next to this one
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret}
      HASH_SECRET: ${HASH_SECRET:-local-hash-secret}
      SEED_ON_START: "1"
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/health"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # the browser calls the API, so this is the host-published address, not the compose network name
        NEXT_PUBLIC_API_URL: http://localhost:3333
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
